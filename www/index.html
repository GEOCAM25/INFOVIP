<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a1930" />
  <meta name="color-scheme" content="dark" />
  <title>INFOVIP</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/logo.png" />
  <link rel="apple-touch-icon" href="./assets/icons/logo.png" />
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <!-- Splash / arranque -->
  <div id="splash" class="splash">
    <img src="./assets/icons/logo.png" alt="INFOVIP" class="splash-logo" />
    <div class="splash-bar"><span></span></div>
  </div>

  <!-- Header -->
  <header id="app-header" class="app-header" hidden>
    <div class="header-brand">
      <img src="./assets/icons/logo.png" alt="" class="header-logo" />
      <span id="header-title">INFOVIP</span>
    </div>
    <div class="header-actions">
      <span id="net-status" class="net-dot" title="Estado de red"></span>
      <button id="btn-settings" class="icon-btn" aria-label="Configuración">⚙️</button>
    </div>
  </header>

  <!-- Contenedor de vistas -->
  <main id="view" class="view" hidden></main>

  <!-- Barra de navegación inferior (se rellena dinámicamente) -->
  <nav id="tabbar" class="tabbar" hidden></nav>

  <!-- Aviso de actualización disponible -->
  <div id="update-toast" class="toast" hidden>
    <span>🔄 Nueva versión disponible</span>
    <button id="btn-update-now">Actualizar</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
