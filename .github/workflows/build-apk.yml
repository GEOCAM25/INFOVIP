name: Build INFOVIP APK

# Compila la app web + Capacitor en un APK de Android y lo publica.
# Se dispara en cada push a la rama principal o manualmente.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear releases con el APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Stamp service worker version
        run: node scripts/stamp-version.mjs "${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

      - name: Add Android platform (Capacitor)
        run: npx cap add android || npx cap sync android

      - name: Patch Android manifest (deep-link login)
        run: node scripts/patch-android.mjs

      - name: Generate app icon & splash (from assets/ logo)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a1930' --iconBackgroundColorDark '#0a1930' --splashBackgroundColor '#060d1c' --splashBackgroundColorDark '#060d1c'

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/INFOVIP-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: INFOVIP-apk
          path: dist/*.apk

      - name: Publish Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: INFOVIP build ${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
